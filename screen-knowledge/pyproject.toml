[project]
name = "screen-knowledge"
version = "0.1.0"
description = "PC作業のスクリーンショットからオペレーションマニュアル・ナレッジを自動構築するローカルツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # AI解析
    "anthropic",
    # 設定・スキーマ
    "pydantic>=2",
    "pydantic-settings>=2",
    "PyYAML>=6",
    # CLI
    "typer",
    # キャプチャ・画像処理
    "mss",
    "Pillow",
    "ImageHash",
    "pynput",
    "psutil",
    # 資格情報
    "keyring",
    # ビューア (Phase 4)
    "fastapi",
    "uvicorn",
    "jinja2",
    # OS別 (Windows)
    "pywin32; sys_platform == 'win32'",
    "pystray; sys_platform == 'win32'",
    # OS別 (macOS)  — AppKit/NSWorkspace ships in the Cocoa framework package
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "rumps; sys_platform == 'darwin'",
]

[project.scripts]
sk = "screen_knowledge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screen_knowledge"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "httpx",  # FastAPI TestClient用
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
